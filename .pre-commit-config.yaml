repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.16.3
  hooks:
  - id: gitleaks
- repo: https://github.com/pre-commit/mirrors-eslint
  # eslint 8 cannot read the project's flat config (eslint.config.mjs) and
  # aborts with "ESLint couldn't find a configuration file". v10.12.0 matches
  # the eslint version pinned in devDependencies.
  rev: v10.12.0
  hooks:
  - id: eslint
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
