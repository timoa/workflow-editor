name: Publish Extension

on:
  # Trigger when called by the Release workflow after Semantic Release creates a new release
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, SHA or tag) to build from'
        required: false
        type: string
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: false

# Declare default permissions as read only.
permissions:
  contents: read
  actions: read
  attestations: read
  checks: read
  deployments: read
  discussions: read
  issues: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  publish:
    name: Publish to Marketplaces
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            marketplace.visualstudio.com:443
            open-vsx.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout with specific ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.ref != ''
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.ref == ''
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.30.3

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-node-${{ hashFiles('.nvmrc') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: |
          pnpm run compile
          pnpm run webpack

      - name: Package extension
        run: pnpm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-vsix
          path: '*.vsix'
          retention-days: 30

      - name: Publish to VS Code Marketplace
        id: publish-vscode
        continue-on-error: true
        run: pnpm run publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        id: publish-ovsx
        continue-on-error: true
        run: npx ovsx publish *.vsix -p $OVSX_PAT
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Report publish status
        run: |
          echo "## Publish Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.publish-vscode.outcome }}" == "success" ]; then
            echo "✅ VS Code Marketplace: Published successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ VS Code Marketplace: Failed to publish" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.publish-ovsx.outcome }}" == "success" ]; then
            echo "✅ Open VSX Registry: Published successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Open VSX Registry: Failed to publish" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Fail the job if both marketplaces failed
          if [ "${{ steps.publish-vscode.outcome }}" != "success" ] && [ "${{ steps.publish-ovsx.outcome }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Both marketplaces failed to publish" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
