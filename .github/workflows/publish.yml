name: Publish Extension

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, SHA or tag) to build from'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: false

permissions:
  contents: read
  actions: read
  attestations: read
  checks: read
  deployments: read
  discussions: read
  issues: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      vsix-path: ${{ steps.upload-vsix.outputs.artifact-path }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            marketplace.visualstudio.com:443
            open-vsx.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout with specific ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: inputs.ref != ''
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: inputs.ref == ''
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-node-${{ hashFiles('.nvmrc') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: |
          pnpm run compile
          pnpm run webpack

      - name: Package extension
        run: pnpm run package
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Upload VSIX artifact
        id: upload-vsix
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: extension-vsix
          path: '*.vsix'
          retention-days: 30

  publish:
    name: Publish to Marketplaces
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        marketplace: [vscode, ovsx]
      fail-fast: false
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v6.0.0
        with:
          name: extension-vsix

      - name: Publish to VS Code Marketplace
        id: publish-vscode
        if: matrix.marketplace == 'vscode'
        run: pnpm run publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        id: publish-ovsx
        if: matrix.marketplace == 'ovsx'
        run: npx ovsx publish *.vsix -p $OVSX_PAT
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Report publish status
        if: always()
        run: |
          echo "## Publish Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ matrix.marketplace }}" == "vscode" ]; then
            if [ "${{ steps.publish-vscode.outcome }}" == "success" ]; then
              echo "✅ VS Code Marketplace: Published successfully" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ VS Code Marketplace: Failed to publish" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          if [ "${{ matrix.marketplace }}" == "ovsx" ]; then
            if [ "${{ steps.publish-ovsx.outcome }}" == "success" ]; then
              echo "✅ Open VSX Registry: Published successfully" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Open VSX Registry: Failed to publish" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  final-status:
    name: Final Status Check
    needs: publish
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check publish results
        run: |
          echo "## Final Publish Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          VS_CODE_STATUS="❌"
          OVSX_STATUS="❌"

          if [ "${{ needs.publish.result }}" == "success" ]; then
            VS_CODE_STATUS="✅"
            OVSX_STATUS="✅"
          else
            if [ "${{ contains(needs.publish.result, 'vscode') }}" == "false" ]; then
              VS_CODE_STATUS="✅"
            fi
            if [ "${{ contains(needs.publish.result, 'ovsx') }}" == "false" ]; then
              OVSX_STATUS="✅"
            fi
          fi

          echo "$VS_CODE_STATUS VS Code Marketplace" >> $GITHUB_STEP_SUMMARY
          echo "$OVSX_STATUS Open VSX Registry" >> $GITHUB_STEP_SUMMARY

          if [ "$VS_CODE_STATUS" == "❌" ] && [ "$OVSX_STATUS" == "❌" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Both marketplaces failed to publish" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi